name: Publish v0.1.11 release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.11.yml
      - release-assets/LabPhotoTools-0.1.11-preview.zip
      - release-assets/RELEASE_NOTES_v0.1.11.md

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify installer archive
        shell: bash
        run: |
          echo "713A7EBB55E2B918D2389948E03285E725D69C43259A38DFF7BED337FF15A98C  release-assets/LabPhotoTools-0.1.11-preview.zip" | sha256sum --check -
          printf '%s  %s\n' "713A7EBB55E2B918D2389948E03285E725D69C43259A38DFF7BED337FF15A98C" "LabPhotoTools-0.1.11-preview.zip" > release-assets/LabPhotoTools-0.1.11-preview.zip.sha256
      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.1.11 >/dev/null 2>&1; then
            gh release upload v0.1.11 release-assets/LabPhotoTools-0.1.11-preview.zip release-assets/LabPhotoTools-0.1.11-preview.zip.sha256 --clobber
            gh release edit v0.1.11 --title "Lab Photo Tools 0.1.11 Preview" --notes-file release-assets/RELEASE_NOTES_v0.1.11.md --prerelease
          else
            gh release create v0.1.11 release-assets/LabPhotoTools-0.1.11-preview.zip release-assets/LabPhotoTools-0.1.11-preview.zip.sha256 --target "$GITHUB_SHA" --title "Lab Photo Tools 0.1.11 Preview" --notes-file release-assets/RELEASE_NOTES_v0.1.11.md --prerelease
          fi
