name: Publish v0.1.17 release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.1.17.yml
      - release-assets/LabPhotoTools-0.1.17-Setup.exe
      - release-assets/LabPhotoTools-0.1.17-preview.zip
      - release-assets/RELEASE_NOTES_v0.1.17.md

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested installers
        shell: bash
        run: |
          echo "0EE9FA72D3DD18D31C43412B5F5FD1036053E0B34140394F1A6880F8D5FC5F29  release-assets/LabPhotoTools-0.1.17-Setup.exe" | sha256sum --check -
          echo "E7BAB67B1CEB6848492C406BCA256AB48923C82AD66260F4458EBFFD66B2C4F5  release-assets/LabPhotoTools-0.1.17-preview.zip" | sha256sum --check -
          printf '%s  %s\n' "0EE9FA72D3DD18D31C43412B5F5FD1036053E0B34140394F1A6880F8D5FC5F29" "LabPhotoTools-0.1.17-Setup.exe" > release-assets/LabPhotoTools-0.1.17-Setup.exe.sha256
          printf '%s  %s\n' "E7BAB67B1CEB6848492C406BCA256AB48923C82AD66260F4458EBFFD66B2C4F5" "LabPhotoTools-0.1.17-preview.zip" > release-assets/LabPhotoTools-0.1.17-preview.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.1.17 >/dev/null 2>&1; then
            gh release upload v0.1.17 release-assets/LabPhotoTools-0.1.17-Setup.exe release-assets/LabPhotoTools-0.1.17-Setup.exe.sha256 release-assets/LabPhotoTools-0.1.17-preview.zip release-assets/LabPhotoTools-0.1.17-preview.zip.sha256 --clobber
            gh release edit v0.1.17 --title "Lab Photo Tools 0.1.17 Preview" --notes-file release-assets/RELEASE_NOTES_v0.1.17.md --prerelease
          else
            gh release create v0.1.17 release-assets/LabPhotoTools-0.1.17-Setup.exe release-assets/LabPhotoTools-0.1.17-Setup.exe.sha256 release-assets/LabPhotoTools-0.1.17-preview.zip release-assets/LabPhotoTools-0.1.17-preview.zip.sha256 --target "$GITHUB_SHA" --title "Lab Photo Tools 0.1.17 Preview" --notes-file release-assets/RELEASE_NOTES_v0.1.17.md --prerelease
          fi

