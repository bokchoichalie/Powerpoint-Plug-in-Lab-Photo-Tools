name: Publish v0.1.15 release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.1.15.yml
      - release-assets/LabPhotoTools-0.1.15-preview.zip
      - release-assets/RELEASE_NOTES_v0.1.15.md

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested installer
        shell: bash
        run: |
          echo "64F99BEC6FDCCFE3A740A854C523B4A2C9A64BBC8DE068FF1FC57A6C34D5161A  release-assets/LabPhotoTools-0.1.15-preview.zip" | sha256sum --check -
          printf '%s  %s\n' "64F99BEC6FDCCFE3A740A854C523B4A2C9A64BBC8DE068FF1FC57A6C34D5161A" "LabPhotoTools-0.1.15-preview.zip" > release-assets/LabPhotoTools-0.1.15-preview.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.1.15 >/dev/null 2>&1; then
            gh release upload v0.1.15 release-assets/LabPhotoTools-0.1.15-preview.zip release-assets/LabPhotoTools-0.1.15-preview.zip.sha256 --clobber
            gh release edit v0.1.15 --title "Lab Photo Tools 0.1.15 Preview" --notes-file release-assets/RELEASE_NOTES_v0.1.15.md --prerelease
          else
            gh release create v0.1.15 release-assets/LabPhotoTools-0.1.15-preview.zip release-assets/LabPhotoTools-0.1.15-preview.zip.sha256 --target "$GITHUB_SHA" --title "Lab Photo Tools 0.1.15 Preview" --notes-file release-assets/RELEASE_NOTES_v0.1.15.md --prerelease
          fi

