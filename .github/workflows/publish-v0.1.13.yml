name: Publish v0.1.13 release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.1.13.yml
      - release-assets/LabPhotoTools-0.1.13-preview.zip
      - release-assets/RELEASE_NOTES_v0.1.13.md

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested installer
        shell: bash
        run: |
          echo "DCF8600920914CE7653A0413DE8559A08306AF1F0B04AF6A9E5ABAA9DD54E035  release-assets/LabPhotoTools-0.1.13-preview.zip" | sha256sum --check -
          printf '%s  %s\n' "DCF8600920914CE7653A0413DE8559A08306AF1F0B04AF6A9E5ABAA9DD54E035" "LabPhotoTools-0.1.13-preview.zip" > release-assets/LabPhotoTools-0.1.13-preview.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.1.13 >/dev/null 2>&1; then
            gh release upload v0.1.13 release-assets/LabPhotoTools-0.1.13-preview.zip release-assets/LabPhotoTools-0.1.13-preview.zip.sha256 --clobber
            gh release edit v0.1.13 --title "Lab Photo Tools 0.1.13 Preview" --notes-file release-assets/RELEASE_NOTES_v0.1.13.md --prerelease
          else
            gh release create v0.1.13 release-assets/LabPhotoTools-0.1.13-preview.zip release-assets/LabPhotoTools-0.1.13-preview.zip.sha256 --target "$GITHUB_SHA" --title "Lab Photo Tools 0.1.13 Preview" --notes-file release-assets/RELEASE_NOTES_v0.1.13.md --prerelease
          fi

